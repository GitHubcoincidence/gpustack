[workspace]
members = [
    "crates/gpustack-cli",
    "crates/gpustack-client",
    "crates/gpustack-runtime",
    "crates/gpustack-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/GitHubcoincidence/gpustack"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.34"
nvml-wrapper = { version = "0.13.0", default-features = false }
prometheus-client = { version = "0.25.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
subtle = { version = "2.6.1", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
url = { version = "2.5", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
